<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ritik Kumar Singh | Software Engineer</title>
  <meta name="description" content="Portfolio of Ritik Kumar Singh — building real-time, full-stack systems.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=IBM+Plex+Mono:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            space: "#07080b",
            surface: "#0a0b0f",
            card: "#0e1016",
            border: "rgba(255,255,255,0.05)",
            ink: "#e9edf3",
            muted: "#8a93a6",
            dim: "#565f74",
            cyan: "#00d4ff",
            purple: "#7c5cfc",
            green: "#34d399",
            amber: "#f59e0b",
          },
          fontFamily: {
            display: ['"Space Grotesk"', "system-ui", "sans-serif"],
            body: ['"IBM Plex Mono"', "monospace"],
            mono: ['"IBM Plex Mono"', "monospace"],
          },
        },
      },
    };
  </script>
  <style>
    html { scroll-behavior: auto; }
    ::-webkit-scrollbar { width: 6px; }
    ::-webkit-scrollbar-track { background: #07080b; }
    ::-webkit-scrollbar-thumb { background: #1a1d26; border-radius: 3px; }
    ::-webkit-scrollbar-thumb:hover { background: #262a37; }
    * { box-sizing: border-box; }
    .scrollbar-none::-webkit-scrollbar { display: none; }
    .scrollbar-none { -ms-overflow-style: none; scrollbar-width: none; }
    .count-up { font-variant-numeric: tabular-nums; }

    .reveal {
      opacity: 0;
      transform: translateY(22px);
      transition: opacity 0.7s ease, transform 0.7s ease;
      will-change: opacity, transform;
    }
    .reveal.is-visible { opacity: 1; transform: translateY(0); }
    .reveal-tilt { transform: translateY(22px) rotateX(4deg); transform-origin: top center; }
    .reveal-tilt.is-visible { transform: translateY(0) rotateX(0deg); }

    .float-glow { animation: floatGlow 7s ease-in-out infinite; }
    .hero-gradient { background-size: 200% 200%; animation: gradientShift 8s ease-in-out infinite; }
    .hero-headline { animation: heroLift 0.9s cubic-bezier(0.16, 1, 0.3, 1); }
    .hero-orb { animation: orbDrift 9s ease-in-out infinite; }
    .hero-orb-b { animation-duration: 11s; animation-delay: -2s; }
    .soft-pulse { animation: softPulse 2.8s ease-in-out infinite; }
    .rec-dot { animation: blink 1.6s ease-in-out infinite; }

    .hover-card {
      position: relative;
      overflow: hidden;
      transition: transform 0.35s ease, box-shadow 0.35s ease, border-color 0.35s ease, background-color 0.35s ease;
    }
    .hover-card::after {
      content: "";
      position: absolute;
      inset: 0;
      background: linear-gradient(115deg, transparent 20%, rgba(255,255,255,0.08) 50%, transparent 80%);
      transform: translateX(-140%);
      transition: transform 0.8s ease;
      pointer-events: none;
    }
    .hover-card:hover::after { transform: translateX(140%); }

    .glow-border::before {
      content: "";
      position: absolute;
      inset: -1px;
      border-radius: inherit;
      padding: 1px;
      background: linear-gradient(135deg, rgba(0,212,255,0.28), rgba(124,92,252,0.14), transparent 60%);
      -webkit-mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);
      -webkit-mask-composite: xor;
      mask-composite: exclude;
      opacity: 0;
      transition: opacity 0.35s ease;
      pointer-events: none;
    }
    .glow-border:hover::before { opacity: 1; }

    .tilt-card { transform-style: preserve-3d; transition: transform 0.2s ease; }
    .scroll-progress {
      background: linear-gradient(90deg, #00d4ff, #7c5cfc, #00d4ff);
      background-size: 200% 100%;
      animation: gradientShift 3s ease-in-out infinite;
    }

    @keyframes floatGlow {
      0%, 100% { transform: translateX(-50%) translateY(0); opacity: 0.28; }
      50% { transform: translateX(-50%) translateY(14px); opacity: 0.38; }
    }
    @keyframes gradientShift {
      0%, 100% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
    }
    @keyframes heroLift {
      0% { opacity: 0; transform: translateY(18px) scale(0.985); }
      100% { opacity: 1; transform: translateY(0) scale(1); }
    }
    @keyframes orbDrift {
      0%, 100% { transform: translate3d(0, 0, 0) scale(1); opacity: 0.3; }
      50% { transform: translate3d(0, 16px, 0) scale(1.08); opacity: 0.45; }
    }
    @keyframes softPulse {
      0%, 100% { opacity: 0.65; }
      50% { opacity: 1; }
    }
    @keyframes blink {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.25; }
    }

    @media (prefers-reduced-motion: reduce) {
      html { scroll-behavior: auto; }
      .reveal, .reveal.is-visible, .reveal-tilt, .reveal-tilt.is-visible { opacity: 1; transform: none; transition: none; }
      .float-glow, .hero-gradient, .hero-headline, .hero-orb, .soft-pulse, .rec-dot { animation: none; }
      .hover-card, .hover-card::after, .glow-border::before, .tilt-card { transition: none; }
    }
  </style>
  <script>
    if ("scrollRestoration" in history) { history.scrollRestoration = "manual"; }
    window.scrollTo(0, 0);
  </script>
</head>
<body class="bg-space text-ink font-body antialiased">
  <div id="root"></div>
  <script crossorigin src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
  <script crossorigin src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
  <script src="app.jsx"></script>
</body>
</html>
